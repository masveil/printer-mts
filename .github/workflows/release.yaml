name: Build Portable (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      - name: Build Tauri (portable)
        run: npm run tauri:build

      - name: Siapkan portable zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" | Where-Object { $_.Name -notlike "*setup*" } | Select-Object -First 1
          if (-not $exe) { Write-Error "exe hasil build tidak ketemu di src-tauri/target/release/"; exit 1 }
          Write-Host "Portable exe: $($exe.FullName)"
          Copy-Item $exe.FullName "Printer-MTs-Portable.exe" -Force
          Compress-Archive -Path "Printer-MTs-Portable.exe" -DestinationPath "Printer-MTs-Portable-win-x64.zip" -Force
          Get-ChildItem "Printer-MTs-Portable*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: printer-mts-windows
          path: Printer-MTs-Portable-win-x64.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Printer-MTs-Portable-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
